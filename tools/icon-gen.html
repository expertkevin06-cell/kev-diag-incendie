<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#120507">
<title>Générateur d'icônes APK — Étude incendie</title>
<link rel="icon" href="../images/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#120507;--surface:#260d14;--line:#4a1a26;--fire:#ff6b35;--fire2:#ff9a3d;--red:#e63946;--text:#fff4ef;--muted:#c9a9a4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 600px at 20% -10%,#3a0d18,#120507 60%);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
::-webkit-scrollbar{width:11px}::-webkit-scrollbar-track{background:#1c070c}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--fire),var(--red));border-radius:99px;border:2px solid #1c070c}
header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.4rem;background:rgba(18,5,7,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:900}.brand span{color:var(--fire2)}button{cursor:pointer;border:1px solid var(--line);background:#33121c;color:var(--text);border-radius:12px;padding:.6rem .9rem;font-weight:700}button:hover{border-color:var(--fire);transform:translateY(-2px)}.btn-fire{background:linear-gradient(135deg,var(--fire),var(--red));border-color:transparent;color:#fff}
main{max-width:1100px;margin:0 auto;padding:1.6rem 1.2rem 4rem}h1{font-size:clamp(1.6rem,4vw,2.4rem);margin:.2rem 0 .6rem}h1 em{font-style:normal;color:var(--fire2)}.lead{color:var(--muted)}
.card{background:linear-gradient(160deg,var(--surface),#1d080d);border:1px solid var(--line);border-radius:18px;padding:1.1rem;margin-bottom:1rem;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.grid{display:grid;grid-template-columns:340px 1fr;gap:1rem;align-items:start}canvas{width:100%;max-width:320px;border-radius:24px;border:1px solid var(--line);background:#120507}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}textarea{width:100%;min-height:190px;background:#1d080d;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:.8rem;font-family:ui-monospace,monospace;font-size:.8rem}
.hint{font-size:.78rem;color:var(--muted)}.previews{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.8rem;margin-top:1rem}.preview{text-align:center}.preview canvas{max-width:120px;border-radius:18px}.preview span{display:block;font-size:.75rem;color:var(--muted);margin-top:.3rem}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="brand">🔥 Icônes <span>APK / PWA</span></div><a href="../"><button>🔥 Application</button></a></header>
<main>
  <h1>Générer les <em>PNG</em> pour PWABuilder.</h1>
  <p class="lead">Icônes 192, 512, maskable et 1024 px prêtes à déposer dans <code>images/</code>.</p>
  <div class="grid">
    <div class="card"><canvas id="main" width="512" height="512"></canvas><div class="hint" style="margin-top:.6rem">Aperçu 512 px.</div></div>
    <div class="card">
      <div class="row">
        <button class="btn-fire" data-size="192" data-name="icon-192x192.png">⬇️ 192</button>
        <button class="btn-fire" data-size="512" data-name="icon-512x512.png">⬇️ 512</button>
        <button data-size="512" data-name="icon-maskable-512.png" data-mask="1">⬇️ maskable 512</button>
        <button data-size="1024" data-name="icon-1024x1024.png">⬇️ 1024</button>
        <button id="all" class="btn-fire">⬇️ Tout</button>
        <button id="svg">⬇️ SVG</button>
      </div>
      <div class="previews" id="previews"></div>
    </div>
  </div>
  <div class="card">
    <div class="row"><button id="copyIcons" class="btn-fire">📋 Copier manifeste</button><span class="hint">Remplace le bloc <code>icons</code> après dépôt des PNG.</span></div>
    <textarea id="manifest" readonly></textarea>
  </div>
</main>
<script>
(function(){
"use strict";
var D=document;
function $(s){return D.querySelector(s);}
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function draw(size,mask){var c=D.createElement("canvas");c.width=c.height=size;var x=c.getContext("2d");var pad=mask?size*.14:0,inner=size-2*pad;x.fillStyle="#120507";roundRect(x,0,0,size,size,size*.18);x.fill();var g=x.createRadialGradient(size/2,size*.62,size*.04,size/2,size*.62,size*.44);g.addColorStop(0,"rgba(255,154,61,.95)");g.addColorStop(.45,"rgba(255,107,53,.55)");g.addColorStop(1,"rgba(18,5,7,0)");x.fillStyle=g;x.fillRect(0,0,size,size);x.save();x.translate(pad,pad);x.scale(inner/512,inner/512);var fg=x.createLinearGradient(0,0,512,512);fg.addColorStop(0,"#ffd166");fg.addColorStop(.45,"#ff6b35");fg.addColorStop(1,"#e63946");x.fillStyle=fg;x.fill(new Path2D("M265 72c10 62-28 88-49 124-22 38-18 84 12 112-4-34 12-58 34-78 8 42 52 62 52 112 0 42-30 76-72 82 62 4 118-44 118-112 0-84-64-118-95-240z"));x.fillStyle="rgba(255,244,239,.92)";x.fill(new Path2D("M232 300c-18 20-26 40-20 62 6 24 28 40 52 40 30 0 54-22 54-52 0-28-22-46-34-70-8 22-26 32-52 20z"));x.fillStyle="#fff4ef";x.font="800 40px Arial";x.textAlign="center";x.fillText("KEVIN",256,448);x.fillStyle="#ff9a3d";x.font="700 20px Arial";x.fillText("PRÉDICTIF",256,478);x.restore();return c;}
function dlCanvas(c,name){c.toBlob(function(b){var a=D.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1200);},"image/png");}
var SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><radialGradient id="g" cx="50%" cy="62%" r="65%"><stop offset="0%" stop-color="#ff9a3d"/><stop offset="45%" stop-color="#ff6b35"/><stop offset="100%" stop-color="#120507"/></radialGradient><linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffd166"/><stop offset="45%" stop-color="#ff6b35"/><stop offset="100%" stop-color="#e63946"/></linearGradient></defs><rect width="512" height="512" rx="96" fill="#120507"/><circle cx="256" cy="300" r="210" fill="url(#g)" opacity=".55"/><path fill="url(#f)" d="M265 72c10 62-28 88-49 124-22 38-18 84 12 112-4-34 12-58 34-78 8 42 52 62 52 112 0 42-30 76-72 82 62 4 118-44 118-112 0-84-64-118-95-240z"/><path fill="#fff4ef" opacity=".92" d="M232 300c-18 20-26 40-20 62 6 24 28 40 52 40 30 0 54-22 54-52 0-28-22-46-34-70-8 22-26 32-52 20z"/><text x="256" y="448" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="800" fill="#fff4ef">KEVIN</text><text x="256" y="478" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#ff9a3d">PRÉDICTIF</text></svg>';
var block='"icons": [\n  {"src":"images/icon.svg","sizes":"any","type":"image/svg+xml","purpose":"any maskable"},\n  {"src":"images/icon-192x192.png","sizes":"192x192","type":"image/png","purpose":"any"},\n  {"src":"images/icon-512x512.png","sizes":"512x512","type":"image/png","purpose":"any"},\n  {"src":"images/icon-maskable-512.png","sizes":"512x512","type":"image/png","purpose":"maskable"},\n  {"src":"images/icon-1024x1024.png","sizes":"1024x1024","type":"image/png","purpose":"any"}\n]';
$("#manifest").value=block;
var main=draw(512,false);$("#main").getContext("2d").drawImage(main,0,0);
var specs=[{s:192,n:"192 px",m:false},{s:512,n:"512 px",m:false},{s:512,n:"maskable 512",m:true},{s:1024,n:"1024 px",m:false}];
$("#previews").innerHTML=specs.map(function(s,i){return '<div class="preview"><canvas id="pv'+i+'" width="'+s.s+'" height="'+s.s+'"></canvas><span>'+s.n+'</span></div>';}).join("");
specs.forEach(function(s,i){$("#pv"+i).getContext("2d").drawImage(draw(s.s,s.m),0,0);});
D.querySelectorAll("[data-size]").forEach(function(b){b.onclick=function(){dlCanvas(draw(+b.dataset.size,b.dataset.mask==="1"),b.dataset.name);};});
$("#all").onclick=function(){var i=0;function next(){if(i>=specs.length)return;var s=specs[i++];var name=s.m?"icon-maskable-512.png":"icon-"+s.s+"x"+s.s+".png";dlCanvas(draw(s.s,s.m),name);setTimeout(next,450);}next();};
$("#svg").onclick=function(){var b=new Blob([SVG],{type:"image/svg+xml"});var a=D.createElement("a");a.href=URL.createObjectURL(b);a.download="icon.svg";a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1200);};
$("#copyIcons").onclick=function(){if(navigator.clipboard)navigator.clipboard.writeText(block).then(function(){alert("Bloc copié");});};
})();
</script>
</body>
</html>
