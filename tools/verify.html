<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#120507">
<title>Auto-vérification — Étude incendie prédictive</title>
<link rel="icon" href="../images/icon.svg" type="image/svg+xml">
<style>
:root{--bg:#120507;--surface:#260d14;--line:#4a1a26;--fire:#ff6b35;--fire2:#ff9a3d;--red:#e63946;--green:#39d98a;--amber:#ffb020;--text:#fff4ef;--muted:#c9a9a4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 600px at 20% -10%,#3a0d18,#120507 60%);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
::-webkit-scrollbar{width:11px}::-webkit-scrollbar-track{background:#1c070c}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--fire),var(--red));border-radius:99px;border:2px solid #1c070c}
header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.4rem;background:rgba(18,5,7,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:900}.brand span{color:var(--fire2)}button{cursor:pointer;border:1px solid var(--line);background:#33121c;color:var(--text);border-radius:12px;padding:.6rem .9rem;font-weight:700}button:hover{border-color:var(--fire);transform:translateY(-2px)}.btn-fire{background:linear-gradient(135deg,var(--fire),var(--red));border-color:transparent;color:#fff}
main{max-width:1100px;margin:0 auto;padding:1.6rem 1.2rem 4rem}h1{font-size:clamp(1.6rem,4vw,2.4rem);margin:.2rem 0 .6rem}h1 em{font-style:normal;color:var(--fire2)}.lead{color:var(--muted)}
.card{background:linear-gradient(160deg,var(--surface),#1d080d);border:1px solid var(--line);border-radius:18px;padding:1.1rem;margin-bottom:1rem;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.8rem}.item{padding:.8rem;border-radius:12px;border:1px solid var(--line);background:#20080d;border-left:4px solid var(--line)}.item.ok{border-left-color:var(--green)}.item.warn{border-left-color:var(--amber)}.item.fail{border-left-color:var(--red)}.item b{display:block;font-size:.85rem}.item span{display:block;font-size:.75rem;color:var(--muted);margin-top:.2rem}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;margin:1rem 0}.summary div{padding:.9rem;border-radius:14px;border:1px solid var(--line);background:#20080d}.summary b{display:block;font-size:1.6rem;color:var(--fire2)}.summary span{font-size:.76rem;color:var(--muted)}
</style>
</head>
<body>
<header><div class="brand">🩺 Auto-vérification <span>Étude incendie prédictive</span></div><a href="../"><button>🔥 Application</button></a></header>
<main>
  <h1>Contrôle <em>complet</em> avant livraison APK.</h1>
  <p class="lead">Vérifie les fichiers, versions, base locale, moteur prédictif, service worker, connexion admin, canal temps réel, partage et mode APK.</p>
  <div class="card">
    <div class="row"><button class="btn-fire" id="runAll">▶️ Lancer tous les tests</button><button id="copyReport">📋 Copier rapport</button><a href="../"><button>🔥 Ouvrir l'application</button></a></div>
  </div>
  <div class="summary"><div><b id="sumOk">0</b><span>réussis</span></div><div><b id="sumWarn">0</b><span>avertissements</span></div><div><b id="sumFail">0</b><span>échecs</span></div><div><b id="sumTotal">0</b><span>contrôles</span></div></div>
  <div class="card"><div class="grid" id="results"></div></div>
</main>
<script>
(function(){
"use strict";
var D=document,W=window,results=[];
function $(s){return D.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function add(cat,label,status,detail){var id=cat+"|"+label,i=results.findIndex(function(r){return r.id===id;});var r={id:id,cat:cat,label:label,status:status,detail:detail||"",ts:Date.now()};if(i>=0)results[i]=r;else results.push(r);render();}
function render(){var ok=results.filter(function(r){return r.status==="ok";}).length,warn=results.filter(function(r){return r.status==="warn";}).length,fail=results.filter(function(r){return r.status==="fail";}).length;$("#sumOk").textContent=ok;$("#sumWarn").textContent=warn;$("#sumFail").textContent=fail;$("#sumTotal").textContent=results.length;var cats=[];results.forEach(function(r){if(cats.indexOf(r.cat)<0)cats.push(r.cat);});$("#results").innerHTML=cats.map(function(c){var list=results.filter(function(r){return r.cat===c;});return '<div><h3>'+esc(c)+' · '+list.filter(function(r){return r.status==="ok";}).length+'/'+list.length+'</h3><div class="grid">'+list.map(function(r){return '<div class="item '+r.status+'"><b>'+esc((r.status==="ok"?"✅ ":r.status==="warn"?"⚠️ ":"❌ ")+r.label)+'</b><span>'+esc(r.detail)+'</span></div>';}).join("")+'</div></div>';}).join("");}
async function text(path){var r=await fetch("../"+path+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return await r.text();}
async function testFiles(){var files=["index.html","js/app.js","js/predictor.js","js/update-engine.js","data/pannes-connues.json","data/keywords.json","data/vehicles.json","data/engines.json","data/correlations.json","manifest.json","service-worker.js","images/icon.svg","404.html","offline.html","tools/verify.html"];for(var i=0;i<files.length;i++){var f=files[i];try{var t=await text(f);add("Fichiers",f,"ok",t.length+" caractères");}catch(e){add("Fichiers",f,"fail",e.message);}}}
async function testVersions(){try{var t=await text("index.html");var core=(t.match(/var V="([^"]+)"/)||[])[1];var app=(await text("js/app.js")).match(/EIK\.appVersion="([^"]+)"/);var pred=(await text("js/predictor.js")).match(/var VERSION\s*=\s*"([^"]+)"/);add("Versions","Noyau ↔ module",core&&app&&core===app[1]?"ok":"fail",(core||"?")+" / "+(app?app[1]:"?"));add("Versions","Predictor",pred?"ok":"warn",pred?pred[1]:"non détecté");}catch(e){add("Versions","Lecture","fail",e.message);}}
async function testPredictor(){try{var t=await text("data/vehicles.json");var j=JSON.parse(t);var brands=j.brands||[],models=j.models||[];add("Predictor","Base véhicules",brands.length&&models.length?"ok":"fail",brands.length+" marques · "+models.length+" modèles");var e=JSON.parse(await text("data/engines.json"));add("Predictor","Base motorisations",e.engines&&e.engines.length?"ok":"fail",e.engines.length+" motorisations");var c=JSON.parse(await text("data/correlations.json"));add("Predictor","Corrélations",c.correlations&&c.correlations.length?"ok":"fail",c.correlations.length+" corrélations");}catch(e){add("Predictor","Bases","fail",e.message);}}
async function testBase(){try{var j=JSON.parse(await text("data/pannes-connues.json"));add("Données","Base pannes",Array.isArray(j)&&j.length?"ok":"fail",Array.isArray(j)?j.length+" fiches":"format invalide");}catch(e){add("Données","Base pannes","fail",e.message);}}
async function testSW(){if(!("serviceWorker" in navigator)){add("Service worker","Support","warn","non supporté");return;}try{var reg=await navigator.serviceWorker.getRegistration("../");add("Service worker","Enregistrement",reg&&reg.active?"ok":"warn",reg?(reg.active?"actif":"installé"):"non enregistré");}catch(e){add("Service worker","Enregistrement","fail",e.message);}if(W.caches){try{var ks=await caches.keys();add("Service worker","Cache",ks.length?"ok":"warn",ks.join(", ")||"aucun");}catch(e){add("Service worker","Cache","fail",e.message);}}}
async function runAll(){results=[];render();add("Réseau","État",navigator.onLine?"ok":"warn",navigator.onLine?"en ligne":"hors ligne");await testFiles();await testVersions();await testPredictor();await testBase();await testSW();add("Partage","API",navigator.share?"ok":navigator.clipboard?"warn":"fail",navigator.share?"natif":"copie");add("Mode","APK/PWA",matchMedia("(display-mode: standalone)").matches?"ok":"warn",matchMedia("(display-mode: standalone)").matches?"détecté":"navigateur");}
$("#runAll").onclick=runAll;
$("#copyReport").onclick=function(){var r=JSON.stringify({timestamp:new Date().toISOString(),results:results},null,2);if(navigator.clipboard)navigator.clipboard.writeText(r).then(function(){alert("Rapport copié");});};
runAll();
})();
</script>
</body>
</html>
